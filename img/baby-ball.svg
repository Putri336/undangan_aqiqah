<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Beach / Play Ball in Pink & Rose -->
  <g id="toy-ball" transform="translate(10, 80)">
    <circle cx="48" cy="55" r="42" fill="#f49abf" stroke="#a63a66" stroke-width="3"/>
    <!-- Stripes on Ball -->
    <path d="M 48 13 C 25 25 18 65 30 90" fill="#ffffff" stroke="#a63a66" stroke-width="2.5"/>
    <path d="M 48 13 C 65 25 72 65 62 92" fill="#e06994" stroke="#a63a66" stroke-width="2.5"/>
    <path d="M 12 40 C 35 48 65 48 88 40" fill="none" stroke="#a63a66" stroke-width="2.5"/>
    <circle cx="48" cy="15" r="8" fill="#ffd066" stroke="#a63a66" stroke-width="2"/>
  </g>

  <!-- Baby Sitting -->
  <g id="baby-sitting">
    <path d="M 98 115 C 85 125 75 130 65 125" fill="#ffd8c2" stroke="#6b4c3b" stroke-width="3" stroke-linecap="round"/>

    <!-- Body -->
    <path d="M 105 105 C 100 120 102 145 110 160 C 120 175 150 175 160 160 C 168 145 165 120 155 105 Z" fill="#ffd8c2" stroke="#6b4c3b" stroke-width="3"/>

    <!-- Diaper with pink tabs -->
    <path d="M 104 140 C 115 142 145 142 160 140 C 165 158 152 176 132 176 C 112 176 99 158 104 140 Z" fill="#ffffff" stroke="#6b4c3b" stroke-width="3"/>
    <rect x="106" y="140" width="12" height="7" rx="2" fill="#f49abf" stroke="#6b4c3b" stroke-width="1.5"/>
    <rect x="146" y="140" width="12" height="7" rx="2" fill="#f49abf" stroke="#6b4c3b" stroke-width="1.5"/>

    <!-- Legs Sitting -->
    <path d="M 110 165 C 98 168 90 178 95 184 C 102 188 118 180 125 170 Z" fill="#ffd8c2" stroke="#6b4c3b" stroke-width="3"/>
    <path d="M 148 165 C 158 170 168 178 165 184 C 158 188 145 182 138 170 Z" fill="#ffd8c2" stroke="#6b4c3b" stroke-width="3"/>

    <!-- Front Arm Leaning on Ball -->
    <path d="M 120 115 C 105 125 90 125 80 120 C 76 118 75 124 78 128 C 88 135 105 135 122 125 Z" fill="#ffd8c2" stroke="#6b4c3b" stroke-width="3"/>

    <!-- Head -->
    <circle cx="132" cy="72" r="42" fill="#ffd8c2" stroke="#6b4c3b" stroke-width="3.5"/>

    <!-- Ear -->
    <circle cx="89" cy="75" r="9" fill="#ffd8c2" stroke="#6b4c3b" stroke-width="3"/>
    <circle cx="174" cy="75" r="9" fill="#ffd8c2" stroke="#6b4c3b" stroke-width="3"/>

    <!-- Hair -->
    <path d="M 94 60 C 98 35 128 30 138 30 C 158 30 172 45 174 62 C 160 52 150 52 138 55 C 125 50 110 52 94 60 Z" fill="#7a4e32" stroke="#5a331c" stroke-width="2.5"/>
    <path d="M 132 30 C 135 24 140 22 142 26 C 143 30 140 33 138 34" fill="#7a4e32" stroke="#5a331c" stroke-width="2.5"/>

    <!-- Eyes -->
    <ellipse cx="116" cy="73" rx="6" ry="7.5" fill="#3b2b20"/>
    <circle cx="114" cy="70" r="2.2" fill="#ffffff"/>
    <ellipse cx="148" cy="73" rx="6" ry="7.5" fill="#3b2b20"/>
    <circle cx="146" cy="70" r="2.2" fill="#ffffff"/>

    <!-- Eyebrows -->
    <path d="M 110 63 C 114 60 120 61 123 64" fill="none" stroke="#7a4e32" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 142 64 C 145 61 151 60 155 63" fill="none" stroke="#7a4e32" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Cheeks -->
    <ellipse cx="106" cy="80" rx="7" ry="4.5" fill="#ff8aa6" opacity="0.65"/>
    <ellipse cx="158" cy="80" rx="7" ry="4.5" fill="#ff8aa6" opacity="0.65"/>

    <!-- Nose -->
    <circle cx="132" cy="78" r="1.8" fill="#d88f75"/>

    <!-- Mouth -->
    <path d="M 124 84 C 126 94 138 94 140 84 Z" fill="#e75a5a" stroke="#6b4c3b" stroke-width="2"/>
  </g>
</svg>