<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgBed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8c9dd" />
      <stop offset="50%" stop-color="#fae3ed" />
      <stop offset="100%" stop-color="#f3b4cd" />
    </linearGradient>
    <linearGradient id="blanketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fdf0f5" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe4d4" />
      <stop offset="100%" stop-color="#ffd5be" />
    </linearGradient>
    <linearGradient id="headband" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8a2be" />
      <stop offset="100%" stop-color="#f580a6" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#a03058" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="400" height="500" rx="30" fill="url(#bgBed)" />
